name: allbiz-bypass-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Xvfb and deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          pip install pydoll-python beautifulsoup4 requests

      - name: Show runner egress IP
        run: |
          python3 -c "import requests; print('EGRESS IP:', requests.get('https://api.ipify.org?format=json', timeout=10).json())"

      - name: Run pydoll test on raw Azure/GitHub Actions IP (no proxy)
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" python3 pydoll_test.py \
            --ss "Rock's Moving Company" --ia US_FL \
            --no-sandbox --captcha-wait 45 --challenge-wait 60 --debug
        working-directory: .
