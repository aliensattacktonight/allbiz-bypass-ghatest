name: allbiz-bypass-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xvfb and deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          pip install nodriver requests

      - name: Show runner egress IP
        run: |
          python3 -c "import requests; print('EGRESS IP:', requests.get('https://api.ipify.org?format=json', timeout=10).json())"

      - name: Patch nodriver's connect-retry window (2.5s is too short for cold CI start)
        run: |
          PKG=$(python3 -c "import nodriver, os; print(os.path.dirname(nodriver.__file__))")
          FILE="$PKG/core/browser.py"
          python3 -c "
          path = '$FILE'
          with open(path) as f:
              content = f.read()
          content = content.replace('for _ in range(5):', 'for _ in range(40):')
          content = content.replace('if _ == 4:', 'if _ == 39:')
          with open(path, 'w') as f:
              f.write(content)
          print('patched:', path)
          "

      - name: Run headed-browser bypass test via Xvfb (search + detail page)
        run: |
          cat > test_bypass.py << 'PYEOF'
          import asyncio
          import re
          import nodriver as uc

          async def wait_for_real_content(page, label):
              content = ""
              for i in range(6):
                  await asyncio.sleep(5)
                  content = await page.get_content()
                  has_rows = "res-bname" in content
                  has_ldjson = 'application/ld+json' in content
                  has_challenge = "Quick security check" in content
                  has_hardblock = "Sorry, you have been blocked" in content
                  title_m = re.search(r"<title>(.*?)</title>", content)
                  print(f"  [{label} t={5*(i+1)}s] len={len(content)} title={title_m.group(1) if title_m else None!r} rows={has_rows} ld_json={has_ldjson} challenge={has_challenge} hardblock={has_hardblock}")
                  if has_rows or has_hardblock or has_ldjson:
                      break
                  if not has_challenge and i >= 1:
                      break
              return content

          async def main():
              browser = await uc.start(
                  headless=False,
                  no_sandbox=True,
                  browser_executable_path="/usr/bin/google-chrome",
                  browser_args=[
                      "--window-size=1280,900",
                      "--disable-dev-shm-usage",
                      "--disable-gpu",
                      "--remote-allow-origins=*",
                  ],
              )

              print("\n=== SEARCH: Rock's Moving Company / US_FL ===")
              page = await browser.get("https://www.allbiz.com/search?ss=Rock's+Moving+Company&ia=US_FL")
              content = await wait_for_real_content(page, "search")
              links = re.findall(r'href="([^"]*/business/[^"]+)"', content)
              print(f"  business links found: {len(links)}, first: {links[0] if links else None}")

              if links:
                  detail_url = links[0] if links[0].startswith("http") else "https://www.allbiz.com" + links[0]
                  print(f"\n=== DETAIL: {detail_url} ===")
                  page2 = await browser.get(detail_url)
                  await wait_for_real_content(page2, "detail")

              try:
                  browser.stop()
              except Exception:
                  pass

          if __name__ == "__main__":
              uc.loop().run_until_complete(main())
          PYEOF
          xvfb-run -a --server-args="-screen 0 1280x900x24" python3 test_bypass.py
